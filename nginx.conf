upstream wahub_frontend {
  server frontend:80;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # Timeouts
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # Long cache for build assets — Next emits hashed filenames in /_next/static/
  location ~* ^/_next/static/ {
    proxy_pass http://wahub_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Next image optimizer — short cache, query string varies
  location ~* ^/_next/image {
    proxy_pass http://wahub_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # RSC / data payloads — never cache (per-request)
  location ~* ^/_next/data/ {
    proxy_pass http://wahub_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
  }

  # Favicons / robots / sitemap — pass through, light cache
  location ~ ^/(favicon\.ico|favicon\.svg|robots\.txt|sitemap.*\.xml|apple-touch-icon.*\.png|manifest\.webmanifest)$ {
    proxy_pass http://wahub_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # Default — SSR HTML / RSC streams (do not cache)
  location / {
    proxy_pass http://wahub_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  error_page 502 503 504 /50x.html;
  location = /50x.html {
    return 503 "Service temporarily unavailable\n";
  }
}
